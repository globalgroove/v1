<!-- #####################################################################
     HOW THIS FILE IS ORGANISED
     #####################################################################
     You only ever edit the three blocks right below, in this order:

       1. AGENDA       the lines of the agenda: title, date and the name of its details.   (edit most often)
       2. EVENT TEXTS  the text of each event, one named entry per event: poster, venue, time, text, link.
       3. SETTINGS     menu, logo, side tab, image, table height.                            (edit rarely)

     Everything after the line "END OF CONTENT" is code and does not need editing.

     How the blocks connect: a line of the AGENDA can end with a name, for example "cannibe".
     When someone clicks that line, the entry called cannibe in EVENT TEXTS opens in the frame on the right.
     A line without a name still shows, it just opens nothing.

     To add an event:  1) add a line to the AGENDA   2) add an entry with the same name to EVENT TEXTS.

     Rules for all three blocks:
       - Keep the quotation marks "like this" and the commas at line ends (the last item of a list has no comma).
       - A quotation mark inside a text needs a backslash: "12\" LP"
       - Paragraphs may contain simple HTML, e.g. <em>italic</em> or <a href="...">a link</a>.
       - Image and file paths are relative to the site root.
     ##################################################################### -->


<!-- =====================================================================

     =====================================================================
     One [ "title", "date", "name" ] per line. The name is optional and must match an entry in EVENT TEXTS.
     Each { title, rows } is a separate table with its own heading, shown in the order written here.
     Add  tools: true  to a table to give it the search field and the year index (and the year rows).
     (A plain [ ... ] list of lines still works: it becomes a table with no heading and no tools.)
     Lines keep the order written here. A table taller than the height limit (see SETTINGS) scrolls.

     YEARS (tables with tools: true): write the full date, year first ("2026 . 11 . 14"). The rows of that table show only
     month and day ("11 . 14"); the year is read from the date and drives the year rows and the year index. Whenever the year changes from one line to the next,
     a small year row appears by itself (and stays pinned at the top while you scroll). You never type the year rows.
     Just keep the lines in order. A line whose date has no year (like "OUT") stays under the previous year.

     SEARCH (same tables): the search field looks at the title, the date and the event's details and text (accents and capitals ignored).
     ===================================================================== -->

<script>
const PAGE = {

  /* ---- WHERE THIS PAGE LIVES ---------------------------------------- */
  root: "",                      // path back to the site root: "" here, "../" one folder down, "../../" two down

  /* ---- SITE MENU (small sticky title; click it to open the list) ---- */
  site: {
    title: "ARM5A",
    links: [                             // [ "text", "link" ]. "#..." jumps to a section of this page.
      ["Work",        "work/"],          // anything else opens that page (folder or file, relative to the site root)
      ["Discography", "discography/"],
      ["Contact",     "contact/"]
    ]                                    // an empty list [] shows the title only, without a menu
  },

  /* ---- THE FLY (a badly animated easter egg over the past events table) -- */
  fly: { href: "crypt/", label: "Fly" },   // a small fly buzzes around inside the table, under the first entry. Squash it (click it) and the page href opens (relative to the site root, like the menu links).
                                 // href: "" = no fly.   label = the hidden name for screen readers

  infoAlways: true,              // true = the Info button is always under the poster; false = only when the event has text, details or a link

  upcomingLabel: "NEXT",         // tiny grey word above the black upcoming rows. "" = none

  /* ---- COLOURS ------------------------------------------------------ */
  theme: "light",                // "light" = always the light paper;  "dark" = always dark;  "auto" = follow the visitor's device setting

  /* ---- PAGE IDENTITY ------------------------------------------------ */
  browserTitle: "ARM5A",         // text on the browser tab
  logo: { src: "", alt: "Home", mark: "registration" },  // small mark left of the menu title, links to the site root.
                                   // Empty src = a placeholder mark, mark: "registration" (square, circle, crosshair), "lens" (black ellipse, tall ring, side wedges) or "cross" (both combined)
                                   // Use a small square SVG or PNG with a transparent background (it is shown up to 28 x 28 px), e.g. "assets/img/logo.svg"
  sideLabel: "AGENDA",            // text on the vertical side tab. "" = show the page number instead
  showTabs: true,                // true = show the side tab; false = hide it
  number: 0,                     // page number (used when sideLabel is empty, and for the next-page box)
  nextPage: "",                  // optional: page the second side box links to, e.g. "work/". It then shows number+1

  /* ---- AGENDA TABLES ------------------------------------------------ */
  agendaMaxHeight: "55vh",       // height limit of each agenda block; a longer block scrolls. Any CSS length: "400px", "60vh"
  agendaSearch: true,            // true = small search field above the agenda; false = hide it
  agendaYearIndex: true,         // true = a row of years above the agenda that jump to each year (only shown when there is more than one year)
  agendaAuto: true,              // true = every event is sorted by today's date: today or later goes to the first table (soonest first),
                                 //        earlier goes to the table with tools: true (newest first). You can write all events in either table.
                                 //        false = each event stays in the table where it is written
  openNext: true,                // true = the frame opens on the next upcoming event (if it has a poster) instead of the halftone image
  emptyUpcoming: "No dates announced",   // line shown when the first table has no event

  /* ---- INTRO TEXT (optional): list of paragraphs, [] hides it ------- */
  text: [""],

  /* ---- LOGO IN THE LEFT COLUMN (shown until an event is opened) ---------- */
  restLogo: { src: "assets/img/arm5a-logo.png", alt: "ARM5" },
                                 // black logo on a transparent background (it turns white in dark mode by itself). "" = show the figure below instead

  /* ---- IMAGE (left column, 3:2 landscape, no border, no caption). Used only when restLogo.src is empty; empty src = halftone grayscale placeholder ---- */
  figure: { src: "", alt: "" }
};
</script>

<style>
/* STYLE SHEET. Same variables as the other pages. It moves to assets/css/style.css in the next step.
   --frame is the thickness of the outer lines of the tables: 1px = light, 3px = heavy like the printed sheet. */
:root{
  --paper:#ECEBE6; --ink:#141413; --rule:#8d8b84; --tab-text:#ECEBE6; --frame:1px; --accent:#7a3cf0;
  --label:"IBM Plex Sans Condensed","Zen Kaku Gothic New","Arial Narrow",Arial,sans-serif;
  --value:"IBM Plex Mono","Zen Kaku Gothic New",ui-monospace,Menlo,Consolas,monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--paper:#171716;--ink:#E6E4DD;--rule:#6b6963;--tab-text:#171716;--accent:#a98bff}
}
:root[data-theme="dark"]{--paper:#171716;--ink:#E6E4DD;--rule:#6b6963;--tab-text:#171716;--accent:#a98bff}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-behavior:smooth;scroll-padding-top:56px}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--label);font-size:15px;line-height:1.35;min-height:100%}
.page{position:relative;max-width:none;margin:0;padding:28px 64px 48px 28px;overflow-x:clip}   /* full width. For a centred, limited width instead: max-width:1400px;margin:0 auto */
.page.no-tabs{padding-right:20px}
a{color:inherit;text-decoration-thickness:1px;text-underline-offset:3px}
a:focus-visible,button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
::selection{background:var(--ink);color:var(--paper)}   /* selected text: the site's own ink/paper pair instead of the browser blue */
mark{background:var(--ink);color:var(--paper);padding:0 1px}   /* search matches */
.agenda tr:hover mark,.agenda tr.on mark,.agenda tr:has(.ev:focus-visible) mark{background:var(--paper);color:var(--ink)}

/* site menu: small sticky title top-left; clicking it opens a ruled list of links */
.site{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;width:max-content;max-width:100%;margin:0 0 12px;display:flex;align-items:center;gap:12px;background:var(--paper);padding-right:8px}
.logo{display:block;flex:none;width:28px;height:28px;color:var(--ink)}
.logo svg,.logo img,.logo canvas{display:block;width:100%;height:100%}
.logo img{object-fit:contain;object-position:left center}
.logo:hover{opacity:.7}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.site-btn{display:block;background:var(--paper);color:var(--ink);border:0;padding:3px 8px 3px 0;font:500 14px/1.3 var(--label);letter-spacing:.14em;cursor:pointer;text-align:left}
/* the open/close hint: a small thin chevron, pale and set apart from the title. Turns up when open; darkens on hover.
   To change it: margin-left = distance from the title, width/height = size, border-color = colour. */
.site-btn::after{content:"";display:inline-block;width:5px;height:5px;margin-left:1.6em;border:solid var(--rule);border-width:0 1px 1px 0;transform:translateY(-3px) rotate(45deg);transition:transform .15s}
.site-btn:hover::after,.site-btn:focus-visible::after{border-color:var(--ink)}
.site-btn[aria-expanded=true]::after{transform:translateY(1px) rotate(225deg)}
.site-btn.static{cursor:default}
.site-btn.static::after{content:""}
.site-menu{position:absolute;top:100%;left:0;margin:2px 0 0;padding:0;list-style:none;min-width:200px;background:var(--paper);border:1px solid var(--rule)}
.site-menu li+li{border-top:1px solid var(--rule)}
.site-menu a{display:block;padding:6px 12px 6px 8px;font-size:14px;letter-spacing:.08em;text-decoration:none}
.site-menu a::before{content:"";display:inline-block;width:1.2em}
.site-menu a[aria-current]::before{content:"\25CF"}
.site-menu a:hover,.site-menu a:focus-visible{background:var(--ink);color:var(--paper);outline:none}

/* logo placeholder marks. "registration" uses the ink colour only; "lens" is ink plus paper-coloured cut-outs */
.logo .ink{fill:currentColor}
.logo .cut{fill:var(--paper);stroke:none}
.logo .cutl{fill:none;stroke:var(--paper);stroke-linecap:round}

/* side tabs: the label of this page, plus the next page as an outlined link when nextPage is set */
.tabs-side{position:fixed;right:0;top:46%;z-index:5;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.tab-side{background:var(--ink);color:var(--tab-text);writing-mode:vertical-rl;font:500 17px/1 var(--value);padding:13px 7px;letter-spacing:.08em}
a.tab-side{text-decoration:none;cursor:pointer;background:var(--paper);color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
a.tab-side:hover,a.tab-side:focus-visible{background:var(--ink);color:var(--tab-text);outline:none}

/* two columns: LEFT (narrower) = the image, or the open event frame; RIGHT (wider) = the agenda tables stacked: upcoming, then past events with search and years. */
.cols{display:grid;grid-template-columns:minmax(300px,420px) minmax(0,1fr);grid-template-areas:"fig past";gap:0 40px   /* the image / event frame keeps a fixed width; the agenda takes the rest */;align-items:start}
.col-l{display:contents}
aside{grid-area:fig;min-width:0}
main{grid-area:past;min-width:0}      /* upcoming and past events stack in the right column; the frame / image on the left starts at the same height */
.text{margin:0 0 18px}
.text[hidden]{display:none}
.text p{margin:0 0 .8em;font:400 15px/1.55 var(--label);hyphens:auto}
.text p:last-child{margin-bottom:0}

/* agenda: a table without lines, same type as the old info lines. A line is clickable; the open one stays black */
.ag-scroll{margin:0 0 1.4em -8px;overflow:auto;scrollbar-width:thin;scrollbar-color:var(--rule) transparent}
.ag-pad{flex:none}
.ag-scroll{position:relative}
.fly-zone{position:absolute;z-index:4;pointer-events:none;overflow:hidden}
.fly-zone[hidden]{display:none}
.fly{position:absolute;left:0;top:0;width:44px;height:44px;padding:10px;border:0;background:none;color:var(--ink);cursor:crosshair;pointer-events:auto;will-change:transform}
.fly svg{display:block;width:100%;height:100%;overflow:visible;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.fly .fill{fill:var(--paper)}
.fly .dot{fill:currentColor;stroke:none}
.fly .eye{stroke-width:1.1}
.fly .flap{animation:fly-flap .13s ease-in-out infinite alternate}
.fly .flap.r{animation-name:fly-flap-r}
.fly.rest .flap{animation-duration:.5s}
@keyframes fly-flap{from{transform:rotate(-28deg)}to{transform:rotate(22deg)}}
@keyframes fly-flap-r{from{transform:rotate(28deg)}to{transform:rotate(-22deg)}}
@media (prefers-reduced-motion:reduce){.fly .flap{animation:none}}
.fly.dead{cursor:default}
.ag-scroll::-webkit-scrollbar{width:6px;height:6px}
.ag-scroll::-webkit-scrollbar-thumb{background:var(--rule)}
.agenda{width:100%;border-collapse:separate;border-spacing:0 2px;margin:0}
.agenda th{font:400 14px/1.35 var(--label);letter-spacing:.14em;text-align:left;padding:2px 28px 2px 8px;vertical-align:top}
.agenda td{width:1%;font:400 13px/1.4 var(--value);padding:2px 8px 2px 0;vertical-align:top;white-space:nowrap}
.agenda tr:not(.yr){cursor:pointer}
.agenda tr:not(.yr):hover>*,.agenda tr.on>*{background:var(--ink);color:var(--paper)}
.agenda tr:has(.ev:focus-visible)>*{background:var(--ink);color:var(--paper)}
.agenda .ev{font:inherit;letter-spacing:inherit;color:inherit;background:none;border:0;padding:0;margin:0;text-align:left;cursor:pointer}
.agenda .ev:focus-visible{outline:2px solid var(--paper);outline-offset:1px}
.agenda tr[hidden],.ag-scroll[hidden]{display:none}

/* year rows: small, letter-spaced, a thin rule above; the current year stays pinned at the top of the scrolling table */
.agenda .yr th{color:var(--rule);padding:6px 0 0;font:400 11px/1 var(--value);letter-spacing:.22em;border-bottom:1px solid color-mix(in srgb,var(--rule) 45%,transparent)}   /* year row: no visible text, just a dim hairline between years (45% of the grey: raise it for a stronger line). The year in view is shown in black in the year index */

/* search field and year index, above the agenda */
.ag-sec{margin:0 0 3.2em}
.ag-sec:last-child{margin-bottom:0}
.ag-head{margin:0 0 10px}

        if (blk.tools && yr && yr !== lastYear) {         // the year changed: add a small year row
          lastYear = yr;
          var ytr = el('tr', 'yr'), yth = el('th'); yth.appendChild(el('span', 'sr', yr)); yth.colSpan = 2;   // the year is only read aloud: on screen the year index shows it in black
           yth.scope = 'rowgroup';
          ytr.appendChild(yth);
          if (markerAt > -1) { body.insertBefore(ytr, items[markerAt].tr); items.splice(markerAt, 0, { yr: true, tr: ytr }); }   // month markers like "OUT" go under the year row
          else { body.appendChild(ytr); items.push({ yr: true, tr: ytr }); }
          if (!yearFirst[yr]) { yearFirst[yr] = { tr: ytr, blk: blk }; yearOrder.push(yr); }
        }
        var ev = Object.assign({ title: row[0], date: row[1] }, row[2] ? (TEXTS[row[2]] || {}) : {});
        var tr = el('tr'), th = el('th'), b = el('button', 'ev', ev.title);
        th.scope = 'row'; b.type = 'button'; b.setAttribute('aria-expanded', 'false'); b.setAttribute('aria-controls', 'detail');
        var shown = ev.date || '';
        if (blk.tools && yr) shown = shown.replace(yr, '').replace(/^[\s.\-\/]+|[\s.\-\/]+$/g, '');   // under a year row the year is not repeated: 2026 . 11 . 14 shows as 11 . 14 (the full date stays in the data, the search and the event frame)
        th.appendChild(b); if (ev.place) th.appendChild(el('span', 'pl', ev.place)); tr.appendChild(th); tr.appendChild(el('td', null, shown));
        if (!block.tools && !nextUp && ev.poster) nextUp = { tr: tr, ev: ev };
        tr.addEventListener('click', function(){ if (current === tr) closeEvent(); else openEvent(tr, ev); });
        b.addEventListener('click', function(e){ e.stopPropagation(); if (current === tr) closeEvent(); else openEvent(tr, ev); });
        body.appendChild(tr);
        if (yr) markerAt = -1; else if (markerAt < 0) markerAt = items.length;      // remember where a run of lines without a year starts
        items.push({ tr: tr, btn: b, text: ev.title, hay: norm([ev.title, ev.date, ev.place || '', (ev.details || []).map(function(d){ return d.join(' '); }).join(' '), [].concat(ev.text || []).join(' ').replace(/<[^>]*>/g, ' ')].join(' ')) });
      });
      var wrap = el('div', 'ag-scroll');                // height limit: a block taller than agendaMaxHeight scrolls
      wrap.style.maxHeight = C.agendaMaxHeight || '55vh';
      table.appendChild(body); wrap.appendChild(table); blk.table = table; if (block.tools) { blk.spacer = el('div', 'ag-pad'); wrap.appendChild(blk.spacer); } sec.appendChild(wrap); (block.tools ? $('agenda') : $('agenda-up')).appendChild(sec);   // both end up stacked in the right column, in the order written
      blk.wrap = wrap; blocks.push(blk);
    });

    // search: every word typed must appear in the title, date, details or text of a line. Empty year rows and empty blocks hide.
    var q = $('ag-q'), xBtn = $('ag-x'), countEl = $('ag-count');
    // highlight: the matched letters of a title are wrapped in <mark> (accents and capitals ignored, like the search itself)
    function highlight(it, terms){
      var txt = it.text, fold = '', map = [];
      for (var i = 0; i < txt.length; i++) {
        var f = txt[i].normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
        for (var k = 0; k < f.length; k++) { fold += f[k]; map.push(i); }
      }
      var hit = new Array(txt.length);
      terms.forEach(function(t){ for (var p = fold.indexOf(t); p > -1; p = fold.indexOf(t, p + 1)) for (var j = p; j < p + t.length; j++) hit[map[j]] = true; });
      it.btn.textContent = '';
      var run = '', on = false;
      function flush(){ if (!run) return; if (on) it.btn.appendChild(el('mark', null, run)); else it.btn.appendChild(document.createTextNode(run)); run = ''; }
      for (var c = 0; c < txt.length; c++) { if (!!hit[c] !== on) { flush(); on = !!hit[c]; } run += txt[c]; }
      flush();
    }
    function filter(){
      var terms = norm(q.value).split(/\s+/).filter(Boolean), shown = 0;
      xBtn.hidden = !terms.length;
      blocks.forEach(function(b){
        if (!b.tools) return;                            // only the table that owns the search is filtered
        b.wrap.scrollTop = 0;                            // every new search starts at the top of the results
        var any = 0, pending = null, n = 0;
        b.items.forEach(function(it){
          if (it.yr) { if (pending) pending.tr.hidden = !n; pending = it; n = 0; return; }
          var ok = terms.every(function(t){ return it.hay.indexOf(t) > -1; });
          it.tr.hidden = !ok; if (ok) { n++; any++; }
          if (terms.length && ok) highlight(it, terms); else if (it.btn.textContent !== it.text || it.btn.firstElementChild) it.btn.textContent = it.text;
        });
        if (pending) pending.tr.hidden = !n;
        b.wrap.hidden = !any; shown += any;
      });
      countEl.textContent = terms.length ? (shown ? shown + (shown === 1 ? ' result' : ' results') : 'No results') : '';
    }
    if (!toolsBlock || C.agendaSearch === false) { $('ag-tools').hidden = true; }
    else {
      $('ag-tools').hidden = false;
      q.addEventListener('input', filter);
      q.addEventListener('keydown', function(e){ if (e.key === 'Escape' && q.value) { q.value = ''; filter(); e.stopPropagation(); } });
      xBtn.addEventListener('click', function(){ q.value = ''; filter(); q.focus(); });
    }

    // year index: 2026 · 2025 · 2024. Each year scrolls its table to that year (only when there is more than one year)
    var yBox = $('ag-years'), ybtn = {};
    if (toolsBlock && C.agendaYearIndex !== false && yearOrder.length > 1) {
      yearOrder.forEach(function(y, i){
        if (i) { var dot = el('span', null, '\u00b7'); dot.setAttribute('aria-hidden', 'true'); yBox.appendChild(dot); }
        var yb = el('button', null, y); yb.type = 'button';
        yb.addEventListener('click', function(){
          var t = yearFirst[y], w = t.blk.wrap;
          if (q.value) { q.value = ''; filter(); refit(); }
          if (w.scrollHeight > w.clientHeight + 1) { w.scrollTop += t.tr.getBoundingClientRect().top - w.getBoundingClientRect().top; w.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
          else window.scrollTo({ top: t.tr.getBoundingClientRect().top + window.scrollY - 88, behavior: 'smooth' });   // phone: the page scrolls, not the table
        });
        yBox.appendChild(yb); ybtn[y] = yb;
      });
      yBox.hidden = false; yBox.parentNode.hidden = false;
    }

    // the year in view (the last year row that has reached the top of the table) turns black in the index
    // blank space under the last rows, so that even the last (short) years can be scrolled up to the top of the table
    function fitSpace(){
      if (!toolsBlock || !toolsBlock.spacer) return;
      var w = toolsBlock.wrap, sp = toolsBlock.spacer, last = null;
      sp.style.height = '0px';
      if (q.value.trim() || w.hidden) return;                       // while searching the list is short: no extra space
      yearOrder.forEach(function(y){ if (!yearFirst[y].tr.hidden) last = yearFirst[y].tr; });
      if (!last) return;
      if (narrow()) { sp.style.height = Math.max(240, window.innerHeight - 90 - (toolsBlock.table.getBoundingClientRect().bottom - last.getBoundingClientRect().top)) + 'px'; return; }   // phone: room for the last years (and the fly)
      if (toolsBlock.table.offsetHeight <= w.clientHeight) return;   // everything fits: nothing to scroll
      var h = toolsBlock.table.getBoundingClientRect().bottom - last.getBoundingClientRect().top;
      sp.style.height = Math.max(0, w.clientHeight - h) + 'px';
    }
    function markYear(){
      if (!toolsBlock) return;
      var w = toolsBlock.wrap, top = (w.scrollHeight > w.clientHeight + 1) ? w.getBoundingClientRect().top + 4 : 90, cur = null;   // phone: the line 90px from the top of the screen
      yearOrder.forEach(function(y){ var tr = yearFirst[y].tr; if (tr.hidden) return; if (!cur || tr.getBoundingClientRect().top <= top) cur = y; });
      Object.keys(ybtn).forEach(function(y){ ybtn[y].classList.toggle('on', y === cur); if (y === cur) ybtn[y].setAttribute('aria-current', 'true'); else ybtn[y].removeAttribute('aria-current'); });
    }
    function refit(){ if (current && current.hidden) closeEvent(true); fitSpace(); markYear(); }
    if (toolsBlock) { toolsBlock.wrap.addEventListener('scroll', markYear, { passive: true }); q.addEventListener('input', refit); xBtn.addEventListener('click', refit); window.addEventListener('resize', refit); window.addEventListener('scroll', markYear, { passive: true }); refit(); }

    // ---- the fly: a minimal fly (a dot and two sticks) that wanders smoothly in the blank space under the oldest entry of the past events table. Squash it to open the hidden page ----
    var fy = C.fly || {};
    if (toolsBlock && fy.href) {
      var wrapF = toolsBlock.wrap, spF = toolsBlock.spacer, zone = el('div', 'fly-zone'), fb = el('button', 'fly');
      fb.type = 'button'; fb.tabIndex = -1; fb.setAttribute('aria-label', fy.label || 'Fly');
      // as minimal as it gets: a dot and two sticks
      fb.innerHTML = '<svg viewBox="-12 -12 24 24" aria-hidden="true"><g class="flap"><path d="M0 0 L-8 -6"/></g><g class="flap r"><path d="M0 0 L8 -6"/></g><circle class="dot" r="2.3"/></svg>';
      zone.appendChild(fb); wrapF.appendChild(zone);        // inside the scrolling table, under the oldest entry
      var S = 44, px = 120, py = 90, ang = Math.random() * 6.28, sp = 40, rest = 0, dead = false, last = 0, t0 = Math.random() * 100,
          calm = window.matchMedia && matchMedia('(prefers-reduced-motion:reduce)').matches;
      function place(extra){ fb.style.transform = 'translate(' + px.toFixed(1) + 'px,' + py.toFixed(1) + 'px) rotate(' + (ang * 57.2958 + 90).toFixed(1) + 'deg)' + (extra || ''); }
      function sync(){
        zone.hidden = wrapF.hidden || spF.offsetHeight < 80;       // no blank space (short list, or searching): no fly
        zone.style.left = '0px'; zone.style.top = spF.offsetTop + 'px';
        zone.style.width = wrapF.clientWidth + 'px'; zone.style.height = spF.offsetHeight + 'px';
      }
      function frame(now){
        if (dead) return;
        requestAnimationFrame(frame);
        var dt = Math.min(.05, (now - (last || now)) / 1000); last = now;
        sync();
        var W = zone.clientWidth - S, H = zone.clientHeight - S;
        if (zone.hidden || W < 20 || H < 20) return;
        var t = now / 1000 + t0;
        if (rest > 0) { rest -= dt; sp += (0 - sp) * Math.min(1, dt * 5); if (rest <= 0) { fb.classList.remove('rest'); sp = 12; } }
        else {
          sp += (55 + 38 * Math.sin(t * .7) - sp) * Math.min(1, dt * 1.5);
          ang += (Math.sin(t * 1.3) + .7 * Math.sin(t * 2.9 + 1)) * 1.1 * dt;                       // lazy, looping wander
          // stay away from the edges: turn gently towards the middle
          var cx = W / 2 - px, cy = H / 2 - py, m = 50;
          if (px < m || px > W - m || py < m || py > H - m) {
            var want = Math.atan2(cy, cx), d = Math.atan2(Math.sin(want - ang), Math.cos(want - ang)); ang += d * Math.min(1, dt * 2.2);
          }
          if (Math.random() < dt * .12) { rest = 1.2 + Math.random() * 2.5; fb.classList.add('rest'); }  // now and then it lands for a moment
        }
        px += Math.cos(ang) * sp * dt; py += Math.sin(ang) * sp * dt;
        px = Math.max(0, Math.min(W, px)); py = Math.max(0, Math.min(H, py));
        place();
      }
      sync(); place();
      if (calm) fb.classList.add('rest'); else requestAnimationFrame(frame);        // reduced motion: it just sits there
      fb.addEventListener('click', function(){
        if (dead) return; dead = true;
        fb.classList.remove('rest'); fb.classList.add('dead');
        fb.innerHTML = '<svg viewBox="-9 -9 18 18" aria-hidden="true"><path class="dot" d="M-3 -1 L-5.5 -3 L-3.2 -4.5 L-1 -6 L1.5 -4.2 L4.5 -5 L4 -2 L6.5 0 L4 1.8 L5 4.5 L2 4 L0 6.2 L-1.8 3.8 L-4.6 4.4 L-3.6 1.6 L-6 0 Z"/><circle class="dot" cx="7" cy="-3" r=".9"/><circle class="dot" cx="-7" cy="3.5" r=".7"/><path d="M5.5 5.5 L8 7 M-5.5 -5 L-8 -7" stroke-width=".8"/></svg>';
        place(' scale(1.5)');
        wrapF.style.transform = 'translateY(2px)'; setTimeout(function(){ wrapF.style.transform = ''; }, 90);       // a small thud
        setTimeout(function(){ location.href = root + fy.href; }, 1100);
      });
      window.addEventListener('pageshow', function(e){ if (e.persisted) location.reload(); });
    }

    // the frame opens on the next upcoming event (if it has a poster); PAGE.openNext: false keeps the halftone image instead
    if (C.openNext !== false && nextUp && !narrow()) openEvent(nextUp.tr, nextUp.ev, true);   // (not on a phone: it would push the lists down)
    $('d-close').addEventListener('click', function(){ closeEvent(); });
    window.addEventListener('resize', dock);
    $('d-flip').addEventListener('click', toggleInfo);
    $('d-poster').addEventListener('click', toggleInfo);
    document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && !detail.hidden && menu.hidden) closeEvent(); });

    // intro text (paragraphs may contain simple HTML); an empty list hides it
    var box = $('text');
    if (!C.text || !C.text.length) { box.hidden = true; }
    else C.text.forEach(function(t){ var p = el('p'); p.innerHTML = t; box.appendChild(p); });

    // image: halftone placeholder when there is no file, otherwise the picture in a 3:2 frame
    var fig = $('fig'), f = C.figure, rl = C.restLogo || {};
    if (rl.src) {
      var lg2 = new Image(); lg2.className = 'rest-logo'; lg2.alt = rl.alt || ''; lg2.onerror = function(){ lg2.hidden = true; };   // if the file is not found nothing is shown (no broken-image text)
      lg2.src = root + rl.src; fig.appendChild(lg2);
    } else if (!f.src) {
      var h = el('div', 'halftone'); h.setAttribute('role', 'img'); h.setAttribute('aria-label', f.alt || 'Image placeholder'); fig.appendChild(h);
    } else {
      var fr = el('div', 'frame'), im = new Image();
      im.src = root + f.src; im.alt = f.alt || ''; im.loading = 'lazy'; im.onerror = function(){ im.hidden = true; };
      fr.appendChild(im); fig.appendChild(fr);
    }
  } catch (e) {
    console.error(e);
    document.body.insertAdjacentHTML('afterbegin', '<p style="padding:12px;font:14px monospace">Content error: check the quotation marks and commas in the content block at the top of the file.</p>');
  }
})();
</script>
