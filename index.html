<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<!-- =====================================================================
     LANDING PAGE  (site root: /index.html)
     CONTENT BLOCK  -  THIS IS THE ONLY PART YOU NEED TO EDIT HERE
     =====================================================================
     The site title and the menu (always open here, with the search) come
     from assets/site.js. Below them, optional info lines, text and an image.

     Rules:
       - Keep the quotation marks "like this" and the commas at line ends.
       - A quotation mark inside a value needs a backslash: "12\" LP"
     ===================================================================== -->
<script>
const PAGE = {

  root: "",                      // path back to the site root: "" here (top folder)
  menuFixed: true,               // the menu is always open on this page, without the arrow

  browserTitle: "Global Overgroove",     // text on the browser tab
  sideTab: "GOG",                // text in the black box on the right edge. "" hides it

  /* ---- INFO LINES (left column):  [ "label", "value" ]. [] hides them ---- */
  info: [],

  /* ---- TEXT (left column): list of paragraphs, [] hides it ---------- */
  text: [],

  /* ---- IMAGE (right column, 3:2 landscape). "" = no image ----------- */
  figure: { src: "", alt: "" },
};
</script>
<!-- ===================== END OF CONTENT BLOCK ===================== -->

<title>Global Overgroove</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/base.css">
<script src="assets/site.js"></script>
<style>
/* landing page only: the same two columns as the list pages */
.tab-side{font-size:22px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:0 22px;align-items:start;margin-top:28px}
.text{margin:0 0 18px}
.text p{margin:0 0 .8em;font:400 15px/1.55 var(--label);hyphens:auto}
.text p:last-child{margin-bottom:0}
.meta{display:grid;grid-template-columns:auto 1fr;gap:4px 28px;margin:0 0 18px;font-size:14px}
.meta dt{letter-spacing:.14em}
.meta dd{margin:0;font-family:var(--value);font-size:13px}
.fig-wrap{margin:0}
.frame{position:relative;aspect-ratio:1.6/1}
.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;background:var(--paper)}
[hidden]{display:none!important}
@media (max-width:760px){.cols{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>
<div class="page" id="top">

  <h1 class="sr" id="h1">Global Overgroove</h1>
  <nav class="site" id="site"></nav>

  <div class="tabs-side" id="tabs-side"><div class="tab-side" id="tab-side" aria-hidden="true"></div></div>

  <div class="cols" id="cols">
    <main>
      <dl class="meta" id="info"></dl>
      <div class="text" id="text"></div>
    </main>
    <aside>
      <figure class="fig-wrap" id="fig"></figure>
    </aside>
  </div>
</div>

<script src="assets/base.js"></script>
<!-- LANDING BUILDER. Reads the PAGE block above. No need to edit. -->
<script>
(function(){
  try {
    var C = PAGE, root = C.root || '', S = (typeof SITE !== 'undefined') ? SITE : {};
    function $(id){ return document.getElementById(id); }
    function el(tag, cls, text){ var e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }

    document.title = C.browserTitle;
    if (S.title) $('h1').textContent = S.title;
    if (C.sideTab) $('tab-side').textContent = C.sideTab;
    else { $('tabs-side').remove(); document.querySelector('.page').classList.add('no-tabs'); }

    (C.info || []).forEach(function(r){ $('info').appendChild(el('dt', null, r[0])); $('info').appendChild(el('dd', null, r[1])); });
    $('info').hidden = !(C.info || []).length;
    (C.text || []).forEach(function(t){ var p = el('p'); p.innerHTML = t; $('text').appendChild(p); });
    $('text').hidden = !(C.text || []).length;

    var f = C.figure || {};
    if (f.src){ var fr = el('div', 'frame'), im = new Image(); im.src = root + f.src; im.alt = f.alt || ''; im.onerror = function(){ im.hidden = true; }; fr.appendChild(im); $('fig').appendChild(fr); }
    $('cols').hidden = !(C.info || []).length && !(C.text || []).length && !f.src;
  } catch (e) {
    console.error(e);
    document.body.insertAdjacentHTML('afterbegin', '<p style="padding:12px;font:14px monospace">Content error: check the quotation marks and commas in the content block at the top of the file.</p>');
  }
})();
</script>
</body>
</html>
